; Tile Machine — Hot Press · Designing · Curing (esp3). Spec: docs/modules/hotpress.md
; Arduino-ESP32 core 2.0.x via espressif32 6.x (see CLAUDE.md §2)

[env:hotpress]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps =
    olikraus/U8g2@^2.36.18
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
