; Tile Machine — Containing (esp2): 4 containers, HX711 load cells, PCA9685 servos. Spec: docs/modules/containing.md
; Arduino-ESP32 core 2.0.x via espressif32 6.x (see CLAUDE.md §2)

[env:containing]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps =
    olikraus/U8g2@^2.36.18
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
