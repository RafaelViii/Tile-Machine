; Tile Machine — Main Hub (esp0)
; Arduino-ESP32 core 2.0.x via espressif32 6.x (see CLAUDE.md §2)

[env:hub]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; two 1.9 MB app slots (room for OTA later)
board_build.partitions = min_spiffs.csv
lib_extra_dirs = ../lib
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
