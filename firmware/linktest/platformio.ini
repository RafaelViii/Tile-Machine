; Tile Machine — link test firmware for module boards (esp1/esp2/esp3).
; Proves auto-pairing + dashboard highlight before the real module firmware exists.
; Drives NO machinery: relays are held OFF and PCA9685 servo outputs are disabled.
;
;   pio run -e shredder   -t upload     (esp1)
;   pio run -e containing -t upload     (esp2)
;   pio run -e hotpress   -t upload     (esp3)

[platformio]
default_envs = shredder

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
build_flags = -Wall

[env:shredder]
build_flags = ${env.build_flags} -DLINKTEST_MODULE=1

[env:containing]
build_flags = ${env.build_flags} -DLINKTEST_MODULE=2

[env:hotpress]
build_flags = ${env.build_flags} -DLINKTEST_MODULE=3
