; Tile Machine — Shredder (esp1). Spec: docs/modules/shredder.md
; Arduino-ESP32 core 2.0.x via espressif32 6.x (see CLAUDE.md §2)
;
; This board's USB auto-download only drives reset: hold BOOT while "Connecting..." shows
; (see firmware/README.md).

[env:shredder]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../lib
lib_deps =
    olikraus/U8g2@^2.36.18
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
